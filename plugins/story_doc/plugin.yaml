name: story_doc
version: 0.4.0
description: "Story-writer Discord workflow with Google Docs sync. PR #4 (this release): adds story_doc_revise (modes replace_body and replace_match; replace_match refused unless the anchor occurs exactly once in the doc body). story_doc_outline still deferred. Activate with `hermes plugins enable story_doc`. Requires the existing `[google]` extra (`pip install hermes-agent[google]`)."
author: NousResearch
kind: standalone
platforms:
  - linux
  - macos
provides_tools:
  - story_doc_create
  - story_doc_read
  - story_doc_append
  - story_doc_revise
  - story_doc_status
